name: ViPER4Android r5

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Prepare draft v8.0-r5 using the device-tested original drivers'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  MIN_SDK_VERSION: 21

jobs:
  verified-package:
    name: Reproduce device-tested r5 payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned upstream ViPER 8.0 ZIP
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/WSTxda/ViPERFX_RE/releases/download/v8.0/viper4android_module.zip \
            --output original-v8.0.zip
      - name: Package only the three validated r5 file replacements
        run: |
          python3 ci/verify_r5.py package original-v8.0.zip module viper4android_module-r5.zip
          sha256sum viper4android_module-r5.zip | tee package-sha256.txt
          cat package-sha256.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ViPER4Android-8.0-r5-tested-driver-payload
          path: |
            viper4android_module-r5.zip
            package-sha256.txt
          if-no-files-found: error

  source-build:
    name: Independently rebuild ${{ matrix.abi }} (comparison only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Compile for comparison only
        run: |
          cmake -S . -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-$MIN_SDK_VERSION \
            -DANDROID_ARM_NEON=TRUE
          cmake --build build/${{ matrix.abi }} --parallel 2
          mkdir -p rebuilt
          cp build/${{ matrix.abi }}/libv4a_re.so rebuilt/libv4a_re_${{ matrix.abi }}.so
      - uses: actions/upload-artifact@v4
        with:
          name: source-built-${{ matrix.abi }}
          path: rebuilt/*.so
          if-no-files-found: error

  compare-rebuild:
    name: Compare rebuilt DSPs against tested binaries
    needs: source-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: source-built-*
          merge-multiple: true
          path: rebuilt/
      - name: Compare ABI binaries
        run: |
          python3 ci/verify_r5.py compare rebuilt/ | tee driver-comparison.txt
          cat driver-comparison.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: r5-rebuilt-driver-comparison
          path: driver-comparison.txt

  draft-release:
    name: Draft r5 release (manual request only)
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release && github.ref == 'refs/heads/main'
    needs: verified-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ViPER4Android-8.0-r5-tested-driver-payload
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0-r5
          name: ViPER4Android RE Fork v8.0-r5
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: false
          body: |
            Original ViPER 8.0 drivers; only two minimal installer fixes and the r5 version label.
            S901B / TachyonOS Android 15: user-tested audio processing PASS.
            RK3588 and earlier Android generations: not yet validated.
            New source-built DSPs are diagnostic only and are never substituted into this ZIP.
          files: dist/viper4android_module-r5.zip
          fail_on_unmatched_files: true
